<style>
/* Layout: the Panot map fills the stage under a thin prototype bar; each interface option floats its own chrome over it. */
:root {
  --pedra-50: #F7F4EE; --pedra-100: #FFFFFF; --pedra-200: #EDE8DF; --linia: #DDD6CA;
  --tinta: #16181A; --tinta-suau: #5C5A55;
  --mar: #1F3C6E; --sobre-mar: #FFFFFF; --mar-suau: #E3EAF4; --focus: #1F3C6E;
  --blau: #2E6FB7; --groc: #F2C230; --verd: #3E8E5A; --vermell: #D9492E; --junta: #E6DFD1;
  --tile-mar: #1F3C6E; --tessela: #F4EFE6; --oct-fill: #F3EEE5;
  --shadow-sheet: 0 -8px 24px rgba(22, 24, 26, .08);
  --shadow-float: 0 4px 14px rgba(22, 24, 26, .10);
  --drop: rgba(22, 24, 26, .16);
  /* Parking states in the UI take the Panot map colours, so a label matches the line it describes. */
  --st-ok: #1A7B46; --st-semi: #0B6F8F; --st-no: #C9362C; --st-nodata: #8F8A82; --st-bay: #2344C4;
  --on-st: #FFFFFF; --on-st-nodata: #16181A;

  --f-display: "Space Grotesk", "Helvetica Neue", system-ui, sans-serif;
  --f-text: "Manrope", "Helvetica Neue", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --f-proto: "Manrope", "Helvetica Neue", system-ui, sans-serif;
  --r-sm: 8px; --r-md: 16px; --r-lg: 28px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pedra-50: #121416; --pedra-100: #1B1F22; --pedra-200: #0D0F11; --linia: #2A3035;
    --tinta: #F4EFE6; --tinta-suau: #A7A39B;
    --mar: #8FB2E8; --sobre-mar: #0D1A30; --mar-suau: #1C2A40; --focus: #F2C230;
    --blau: #5C98DE; --groc: #F2C230; --verd: #5FB57C; --vermell: #EE6A4F; --junta: #262B2F;
    --tile-mar: #1F3C6E; --tessela: #2E3337; --oct-fill: #1B1F22;
    --shadow-sheet: 0 -8px 24px rgba(0, 0, 0, .5); --shadow-float: 0 4px 14px rgba(0, 0, 0, .45); --drop: rgba(0, 0, 0, .55);
    --st-ok: #4CC585; --st-semi: #3DB5DA; --st-no: #FF6B5E; --st-nodata: #8F8A82; --st-bay: #8398FF;
    --on-st: #121416; --on-st-nodata: #121416;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --pedra-50: #121416; --pedra-100: #1B1F22; --pedra-200: #0D0F11; --linia: #2A3035;
  --tinta: #F4EFE6; --tinta-suau: #A7A39B;
  --mar: #8FB2E8; --sobre-mar: #0D1A30; --mar-suau: #1C2A40; --focus: #F2C230;
  --blau: #5C98DE; --groc: #F2C230; --verd: #5FB57C; --vermell: #EE6A4F; --junta: #262B2F;
  --tile-mar: #1F3C6E; --tessela: #2E3337; --oct-fill: #1B1F22;
  --shadow-sheet: 0 -8px 24px rgba(0, 0, 0, .5); --shadow-float: 0 4px 14px rgba(0, 0, 0, .45); --drop: rgba(0, 0, 0, .55);
  --st-ok: #4CC585; --st-semi: #3DB5DA; --st-no: #FF6B5E; --st-nodata: #8F8A82; --st-bay: #8398FF;
  --on-st: #121416; --on-st-nodata: #121416;
  color-scheme: dark;
}
/* Options B and C try a fresher pairing: a newsroom grotesk for names, a face built for reading at a glance. */
:root[data-ui="b"], :root[data-ui="c"] {
  --f-display: "Schibsted Grotesk", "Helvetica Neue", system-ui, sans-serif;
  --f-text: "Atkinson Hyperlegible Next", "Helvetica Neue", system-ui, sans-serif;
  --f-mono: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, monospace;
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; overflow: hidden; display: flex; flex-direction: column;
  background: var(--pedra-50); color: var(--tinta); font: 400 1rem/1.5 var(--f-text);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.float { background: var(--pedra-100); border: 1px solid var(--linia); box-shadow: var(--shadow-float); }

/* ---------- prototype bar ---------- */
.proto { flex: none; position: relative; z-index: 8; display: flex; align-items: center; gap: 8px; padding: 6px 16px;
  background: var(--pedra-100); border-bottom: 1px solid var(--linia); font-family: var(--f-proto); }
.proto__brand { display: none; align-items: center; gap: 10px; flex: none; }
.proto__brand .mark { display: block; width: 32px; height: 32px; }
.proto__brand b { font: 600 1.125rem/1 "Space Grotesk", "Helvetica Neue", system-ui, sans-serif; }
.proto__brand small { font-size: .8125rem; color: var(--tinta-suau); }
.opts { flex: 1; min-width: 0; display: flex; gap: 3px; padding: 3px; background: var(--pedra-200); border-radius: 12px; }
.opts button { flex: 1; min-width: 0; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px;
  border: 0; border-radius: 9px; background: transparent; color: var(--tinta-suau); font: 600 .875rem/1 var(--f-proto); }
.opts button b { flex: none; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 5px;
  border: 1.5px solid currentColor; font: 700 .6875rem/1 var(--f-proto); }
.opts button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opts button[aria-pressed="true"] { background: var(--pedra-100); color: var(--tinta); box-shadow: 0 1px 3px var(--drop); }
.opts button[aria-pressed="true"] b { background: var(--tinta); color: var(--pedra-100); border-color: var(--tinta); }
.theme-btn { flex: none; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 10px;
  border: 1px solid var(--linia); border-radius: 12px; background: var(--pedra-100); font: 600 .875rem/1 var(--f-proto); }
.theme-btn span { display: none; }
@media (max-width: 419px) { .opts button b { display: none; } }

/* ---------- stage and map ---------- */
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--pedra-200); --dock: 0px; }
#map { position: absolute; inset: 0; }
.loading { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 24px; background: var(--pedra-50); text-align: center; }
.loading p { margin: 0; max-width: 30ch; color: var(--tinta-suau); }
.loading strong { display: block; color: var(--tinta); font: 600 1.25rem/1.3 var(--f-display); margin-bottom: 4px; }
.me { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; pointer-events: none;
  background: color-mix(in srgb, var(--mar) 16%, transparent); }
.me::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mar); box-shadow: 0 0 0 2.5px var(--pedra-100); }

/* ---------- shared pieces ---------- */
.tag { --st: var(--st-nodata); display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 4px 10px 4px 7px;
  border-radius: var(--r-sm); background: var(--st); color: var(--on-st); font: 700 13px/16px var(--f-text); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.tag svg.i { width: 16px; height: 16px; stroke-width: 2.25; }
.t-ok { --st: var(--st-ok); } .t-semi { --st: var(--st-semi); } .t-no { --st: var(--st-no); } .t-bay { --st: var(--st-bay); }
.t-prob { --st: var(--st-no); } .t-nodata { --st: var(--st-nodata); }
.tag.t-nodata { color: var(--on-st-nodata); }
.tag.t-prob { background: transparent; color: var(--tinta); border: 2px dashed var(--st-no); padding: 2px 8px 2px 5px; }
.tag.t-prob svg.i { color: var(--st-no); }
.dato { font: 500 15px/20px var(--f-mono); font-variant-numeric: tabular-nums; color: var(--tinta-suau); }
.btn-primary { flex: 1; min-width: 0; min-height: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 0 20px;
  border: 0; border-radius: var(--r-md); background: var(--mar); color: var(--sobre-mar); font: 700 1.0625rem/1.1 var(--f-text); text-decoration: none; text-align: center; }
.btn-icon { flex: none; width: 52px; height: 52px; display: grid; place-items: center; padding: 0;
  border: 1px solid var(--linia); border-radius: var(--r-md); background: var(--pedra-100); color: var(--tinta); }
.btn-icon[aria-pressed="true"] { background: var(--mar-suau); color: var(--mar); border-color: transparent; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--tinta); }
.icon-btn:hover { background: var(--pedra-200); }
.toast { position: absolute; z-index: 7; left: 16px; right: 16px; bottom: calc(var(--dock) + 88px); margin: 0 auto; max-width: 420px;
  padding: 12px 16px; border-radius: var(--r-md); background: var(--tinta); color: var(--pedra-50); font: 500 .875rem/1.4 var(--f-text); box-shadow: var(--shadow-float); }

/* Locate: the one octagonal control, cut like an Eixample block. */
.locate { position: absolute; z-index: 2; right: 16px; bottom: calc(var(--dock) + 16px); width: 56px; height: 56px; padding: 0; border: 0;
  background: none; color: var(--mar); display: grid; place-items: center; filter: drop-shadow(0 3px 6px var(--drop)); transition: bottom .32s cubic-bezier(.2, .8, .2, 1); }
.locate .oct { position: absolute; inset: 0; width: 100%; height: 100%; }
.locate .oct polygon { fill: var(--pedra-100); stroke: var(--linia); stroke-width: 1.5; }
.locate:focus-visible { outline: none; }
.locate:focus-visible .oct polygon { stroke: var(--focus); stroke-width: 3.5; }
.locate svg.i { position: relative; }

/* ---------- bottom sheet ---------- */
.sheet { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; max-height: 76%; display: flex; flex-direction: column;
  background: var(--pedra-100); border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: var(--shadow-sheet);
  transform: translateY(calc(100% + 32px)); visibility: hidden; opacity: 1;
  transition: transform .32s cubic-bezier(.2, .8, .2, 1), opacity .2s, visibility 0s linear .32s; }
.sheet[data-open="true"] { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2, .8, .2, 1), opacity .2s; }
.sheet.snap { height: calc(100% - 72px); max-height: none; }
.sheet.snap[data-open="true"] { transform: translateY(var(--sy, 50%)); }
.sheet.dragging { transition: none; }
.sheet__handle { flex: none; width: 100%; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: none;
  border-radius: var(--r-lg) var(--r-lg) 0 0; touch-action: none; }
.sheet__handle span { width: 40px; height: 4px; border-radius: 2px; background: var(--linia); }
.sheet__close { position: absolute; top: 4px; right: 8px; display: none; }
:root[data-ui="b"] .sheet__close { display: grid; }
.sheet__scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 20px; }
.sheet.snap:not([data-snap="full"]) .sheet__scroll { overflow: hidden; }
.sheet.snap .sheet__peek { touch-action: none; }
.sheet__peek { display: flex; flex-direction: column; gap: 8px; }
.sheet__row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding-right: 44px; }
.title { margin: 4px 0 0; font: 600 28px/32px var(--f-display); letter-spacing: -.01em; text-wrap: balance; overflow-wrap: anywhere; }
.sub { margin: 0; font: 400 14px/20px var(--f-text); color: var(--tinta-suau); }
.body { margin: 0; font: 400 16px/24px var(--f-text); max-width: 60ch; }
.law { margin: -8px 0 0; font: 400 13px/18px var(--f-text); color: var(--tinta-suau); }
.linkrow { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; border: 1px solid var(--linia); border-radius: var(--r-md);
  background: var(--pedra-50); color: var(--tinta); text-align: left; font: 600 15px/1.3 var(--f-text); }
.linkrow .dato { margin-left: auto; color: var(--tinta); }
.actions { display: flex; gap: 8px; }
.foot { margin: -4px 0 0; font: 400 13px/18px var(--f-text); color: var(--tinta-suau); }
.empty h2 { margin: 0 0 4px; font: 600 20px/26px var(--f-display); }
.empty p { margin: 0; color: var(--tinta-suau); }

/* ---------- A · Xamfrà ---------- */
.a-top { position: absolute; z-index: 4; top: 16px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; }
.search { position: relative; margin: 0; }
.search__box { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 4px 0 16px; border-radius: var(--r-md); }
.search__box:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.search__box input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font: 400 1.0625rem/1.4 var(--f-text); }
.search__box input::placeholder { color: var(--tinta-suau); opacity: 1; }
.search__box input::-webkit-search-cancel-button { display: none; }
.results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; margin: 0; padding: 6px; list-style: none; border-radius: var(--r-md);
  max-height: min(320px, 50vh); overflow: auto; z-index: 5; }
.results li { min-height: 44px; padding: 10px 12px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
.results li[aria-selected="true"], .results li:hover { background: var(--mar-suau); }
.results li.none { cursor: default; color: var(--tinta-suau); background: none; }
.results mark { background: none; color: inherit; font-weight: 800; }
.results small { flex: none; color: var(--tinta-suau); font-size: .8125rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: var(--r-sm); font: 700 13px/16px var(--f-text); letter-spacing: .04em; text-transform: uppercase; color: var(--tinta); }
.chip[aria-pressed="true"] { background: var(--mar-suau); color: var(--mar); border-color: transparent; }

.welcome { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; background: var(--pedra-50); }
.welcome__art { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--junta); }
.welcome__art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.welcome__oct { position: absolute; left: 50%; top: 50%; width: min(60%, 300px); max-height: 82%; aspect-ratio: 1; transform: translate(-50%, -50%); }
.welcome__text { flex: none; display: flex; flex-direction: column; gap: 10px; padding: 28px 24px 24px; }
.welcome h1 { margin: 0; font: 600 40px/44px var(--f-display); letter-spacing: -.02em; }
.welcome p { margin: 0; font: 400 1.125rem/1.45 var(--f-text); color: var(--tinta-suau); }
.progress { width: 120px; height: 6px; margin: 10px 0 6px; border-radius: 3px; background: var(--linia); overflow: hidden; }
.progress span { display: block; width: 0; height: 100%; background: var(--mar); transition: width .3s; }
.welcome .btn-primary { flex: none; }

/* ---------- B · Mirilla ---------- */
.crosshair { position: absolute; z-index: 2; left: 0; top: 0; width: 56px; height: 56px; pointer-events: none; will-change: transform; }
.crosshair .halo { fill: none; stroke: var(--pedra-100); stroke-width: 6; stroke-linejoin: round; }
.crosshair .ring { fill: none; stroke: var(--tinta); stroke-width: 2.25; stroke-linejoin: round; }
.crosshair .dot { fill: var(--tinta); stroke: var(--pedra-100); stroke-width: 2; }
.pill { position: absolute; z-index: 4; top: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px);
  min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 6px 14px 6px 6px; border-radius: 28px; text-align: left; color: var(--tinta); }
.pill__ic { --st: var(--pedra-200); flex: none; width: 42px; height: 42px; border-radius: 21px; display: grid; place-items: center; background: var(--st); color: var(--on-st); }
.pill__ic.t-none { color: var(--tinta); }
.pill__ic.t-nodata { color: var(--on-st-nodata); }
.pill__ic.t-prob { background: transparent; border: 2px dashed var(--st-no); color: var(--st-no); }
.pill__txt { min-width: 0; display: flex; flex-direction: column; }
.pill__main { font: 700 1rem/1.25 var(--f-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill__data { font: 500 .875rem/1.3 var(--f-mono); color: var(--tinta-suau); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.pill > svg.i:last-child { color: var(--tinta-suau); }

/* ---------- C · Cerca de ti ---------- */
.near { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding-bottom: 16px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.near > * { pointer-events: auto; }
.near__head { align-self: flex-start; margin: 0 0 0 16px; display: flex; align-items: baseline; gap: 8px; padding: 6px 12px; border-radius: 16px;
  font: 700 13px/18px var(--f-text); letter-spacing: .04em; text-transform: uppercase; }
.near__head .dato { font-size: 13px; text-transform: none; letter-spacing: 0; }
.cards { --card-w: min(300px, calc(100% - 72px)); position: relative; margin: 0; list-style: none; display: flex; gap: 12px; overflow-x: auto;
  scroll-snap-type: x mandatory; padding: 4px calc((100% - var(--card-w)) / 2) 6px; scrollbar-width: none; }
.cards::-webkit-scrollbar { display: none; }
.card { flex: 0 0 var(--card-w); scroll-snap-align: center; display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: var(--r-md); }
.card[aria-current="true"] { border-color: var(--tinta); box-shadow: 0 0 0 1px var(--tinta), var(--shadow-float); }
.card__main { display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 0; border: 0; background: none; text-align: left; color: var(--tinta); border-radius: var(--r-sm); }
.card__row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card__title { font: 600 1.25rem/1.25 var(--f-display); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card__meta { font: 400 .875rem/1.35 var(--f-text); color: var(--tinta-suau); }
.card .btn-primary { flex: none; min-height: 44px; font-size: .9375rem; }
.card:not([aria-current="true"]) .btn-primary { background: transparent; color: var(--mar); box-shadow: inset 0 0 0 1.5px var(--mar); }
.card.empty { color: var(--tinta-suau); }

@media (min-width: 900px) {
  .proto__brand { display: flex; }
  .theme-btn span { display: inline; }
  .a-top { right: auto; width: 380px; }
  .sheet, .sheet.snap { left: 16px; right: auto; top: var(--panel-top, 16px); bottom: auto; width: 380px; height: auto;
    max-height: calc(100% - var(--panel-top, 16px) - var(--dock) - 16px); border-radius: var(--r-lg); box-shadow: var(--shadow-float);
    transform: translateX(-16px); opacity: 0; }
  .sheet[data-open="true"], .sheet.snap[data-open="true"] { transform: none; opacity: 1; }
  :root[data-ui="a"] .sheet { --panel-top: 136px; }
  .sheet.snap .sheet__scroll { overflow: auto !important; }
  .sheet__handle { display: none; }
  .sheet__close { display: grid; }
  .sheet__scroll { padding-top: 20px; }
  .welcome { flex-direction: row; }
  .welcome__text { width: 440px; justify-content: center; padding: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; scroll-behavior: auto !important; }
}
</style>

  <!-- A · Xamfrà -->

    <form class="search" role="search" id="search" autocomplete="off">
      <label class="search__box float" for="q">

          aria-expanded="false" aria-controls="results" enterkeyhint="search" spellcheck="false">
        <button type="button" class="icon-btn" id="q-clear" aria-label="Borrar búsqueda" hidden>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </label>

    </form>
    <div class="chips" role="group" aria-label="Qué mostrar">
      <button type="button" class="chip float" data-filter="todas" aria-pressed="true">Todas</button>
      <button type="button" class="chip float" data-filter="calzada" aria-pressed="false">En calzada</button>
      <button type="button" class="chip float" data-filter="acera" aria-pressed="false">Acera</button>

      <polygon class="halo" points="19,6 37,6 50,19 50,37 37,50 19,50 6,37 6,19"/>
      <polygon class="ring" points="19,6 37,6 50,19 50,37 37,50 19,50 6,37 6,19"/>
      <path class="halo" d="M28 1v9M28 46v9M1 28h9M46 28h9"/><path class="ring" d="M28 1v9M28 46v9M1 28h9M46 28h9"/>
      <circle class="dot" cx="28" cy="28" r="3.5"/>
    </svg>
  </div>
  <button type="button" class="pill float" id="pill" data-for="b" aria-expanded="false" aria-controls="sheet"></button>
  <p class="sr" id="live" aria-live="polite"></p>

  <!-- C · Cerca de ti -->
  <section class="near" id="near" data-for="c" aria-label="Opciones cercanas">
    <p class="near__head float" id="near-head"></p>
    <ol class="cards" id="cards"></ol>
  </section>

  <button type="button" class="locate" id="locate" aria-label="Mi ubicación">
    <svg class="oct" viewBox="0 0 56 56" aria-hidden="true"><polygon points="17,1 39,1 55,17 55,39 39,55 17,55 1,39 1,17"/></svg>
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg>
  </button>

      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="sheet__scroll" id="sheet-body"></div>
  </section>

  <p class="toast" id="toast" role="status" hidden></p>

    </div>
  </div>
</main>

<script>

(() => {

// ---------- state, kept per viewer ----------

const THEMES = { system: "Sistema", light: "Día", dark: "Noche" };
const state = { ui: "a", theme: "system", filter: "todas", street: -1 };
let saved = new Set();
try {
  const s = JSON.parse(localStorage.getItem("motobcn-interfaz") || "{}");
  if (UIS[s.ui]) state.ui = s.ui;
  if (THEMES[s.theme]) state.theme = s.theme;
  if (Array.isArray(s.saved)) saved = new Set(s.saved);
} catch (e) { /* storage blocked: defaults */ }
const hashUI = Object.keys(UIS).find((k) => UIS[k].hash === location.hash.slice(1));
if (hashUI) state.ui = hashUI;
const save = () => { try { localStorage.setItem("motobcn-interfaz", JSON.stringify({ ui: state.ui, theme: state.theme, saved: [...saved] })); } catch (e) {} };
const resolvedTheme = () => (state.theme === "system" ? (darkScheme.matches ? "dark" : "light") : state.theme);
function applyRootAttrs() {
  root.dataset.ui = state.ui;
  if (state.theme === "system") delete root.dataset.theme; else root.dataset.theme = state.theme;
}
applyRootAttrs();

// ---------- icons (Lucide style, 1.75 stroke) ----------
const svg = (body) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
const ICON = {
  nav: svg('<path d="M3 11 22 2l-9 19-2-8z"/>'),
  bookmark: svg('<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>'),
  chevron: svg('<path d="m18 15-6-6-6 6"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  moon: svg('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'),
  system: svg('<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>'),
  aim: svg('<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>'),
};
const TONE = {
  ok: '<path d="M20 6 9 17l-5-5"/>',
  semi: '<path d="M5 18 11 6M13 18l6-12"/>',
  no: '<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',
  prob: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/>',
  nodata: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/>',
  bay: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M10 16V8h3a2.5 2.5 0 0 1 0 5h-3"/>',

const toneIcon = (t) => svg(TONE[t]);
const tagHTML = (m) => `<span class="tag t-${m.tone}">${toneIcon(m.tone)}${esc(m.label)}</span>`;
// The simple mark: chamfered octagon and scooter, from docs/design/assets/marca-simple.svg.
const MOTO = (fg, bg) => `<svg x="18" y="28.4" width="64" height="45" viewBox="358 340 316 222">
  <rect x="392" y="390" width="120" height="28" rx="14" style="fill:${fg}"/><path d="M378 480 C 370 438 396 412 440 412 L 522 412 C 536 412 542 424 538 438 L 528 480 Z" style="fill:${fg}"/>
  <rect x="500" y="456" width="84" height="24" rx="12" style="fill:${fg}"/><path d="M566 480 L 590 362 C 592 352 610 352 612 362 L 636 468 C 638 476 632 482 624 482 Z" style="fill:${fg}"/>
  <path d="M570 350 L 624 344" style="stroke:${fg};fill:none" stroke-width="18" stroke-linecap="round"/>
  <circle cx="414" cy="502" r="56" style="fill:${bg}"/><circle cx="614" cy="502" r="56" style="fill:${bg}"/>
  <circle cx="414" cy="502" r="40" style="stroke:${fg};fill:none" stroke-width="20"/><circle cx="614" cy="502" r="40" style="stroke:${fg};fill:none" stroke-width="20"/>
  <circle cx="414" cy="502" r="10" style="fill:${fg}"/><circle cx="614" cy="502" r="10" style="fill:${fg}"/></svg>`;
const OCT = (fill, stroke, sw) => `<polygon points="30,${sw / 2} 70,${sw / 2} ${100 - sw / 2},30 ${100 - sw / 2},70 70,${100 - sw / 2} 30,${100 - sw / 2} ${sw / 2},70 ${sw / 2},30" style="fill:${fill};stroke:${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
$("#brand-mark").innerHTML = `<svg class="mark" viewBox="0 0 100 100" aria-hidden="true">${OCT("var(--mar)", "none", 0)}${MOTO("var(--sobre-mar)", "var(--mar)")}</svg>`;
$("#welcome-oct").innerHTML = `<svg class="welcome__oct" viewBox="0 0 100 100" aria-hidden="true">${OCT("var(--oct-fill)", "var(--junta)", 4)}${MOTO("var(--mar)", "var(--oct-fill)")}</svg>`;

// ---------- map palette: direction A · Panot, unchanged ----------
const PAL = {
  light: {
    bg: "#AEB3B6", walk: "#E8E3D9", tile: "#DCD5C8", curb: "#9A958C", plaza: "#ECE7DD", peat: "#E6DCC5", park: "#BCD0A0",
    green: "#A6C189", water: "#A5C8D4", zebra: "#F7F6F2", block: "#D8C6A8", facade: "#B39C78", tree: "#5F8740", treeA: 0.28, pit: "#8C8069",
    text: "#39342D", halo: "#EFEBE3", soft: "#6A6257", landmark: "#7A5728",
    ok: "#1E8A4F", semi: "#0B6F8F", no: "#C9362C", nodata: "#8F8A82", bay: "#2344C4", bayEdge: "#FFFFFF", bayText: "#FFFFFF",
    sel: "#16140F", selHalo: "#FFFFFF", street: "#2344C4",
    heat: ["rgba(255,214,77,0.40)", "rgba(245,150,40,0.58)", "rgba(215,58,34,0.70)", "rgba(165,24,24,0.80)"],
    mask: "#EFECE6", maskA: 0.93, edge: "#8F8A82", metro: "#39342D",
  },
  dark: {
    bg: "#1B1E21", walk: "#2F2D29", tile: "#3A3732", curb: "#5A564F", plaza: "#33312C", peat: "#39342B", park: "#2F3D27",
    green: "#34462A", water: "#22404A", zebra: "#CFCBC3", block: "#473E32", facade: "#63574A", tree: "#6E9A4E", treeA: 0.26, pit: "#1E1C19",
    text: "#E6E0D5", halo: "#1B1E21", soft: "#A39A8C", landmark: "#D2AE72",
    ok: "#4CC585", semi: "#3DB5DA", no: "#FF6B5E", nodata: "#7F7A71", bay: "#8398FF", bayEdge: "#1B1E21", bayText: "#0B1236",
    sel: "#FFFFFF", selHalo: "#000000", street: "#8398FF",
    heat: ["rgba(255,214,77,0.35)", "rgba(245,150,40,0.55)", "rgba(255,90,60,0.68)", "rgba(255,60,50,0.80)"],
    mask: "#131416", maskA: 0.92, edge: "#6F6A62", metro: "#E6E0D5",
  },
};

// ---------- style building (direction A of design/prototipo, other directions removed) ----------
// Widths in metres: MapLibre uses 512 px tiles, so one metre at zoom z is PPM0 * 2^z pixels here.
const PPM0 = 512 / (40075016.686 * Math.cos(41.396 * Math.PI / 180));
const px = (m, z) => +(m * PPM0 * 2 ** z).toFixed(2);
const zx = (...s) => ["interpolate", ["exponential", 2], ["zoom"], ...s];
const zl = (...s) => ["interpolate", ["linear"], ["zoom"], ...s];
function metres(m, floor) { // real size at high zoom, never thinner than floor pixels
  const z = Math.log2(floor / (m * PPM0));
  if (z >= 19.9) return floor;
  if (z <= 14) return zx(14, px(m, 14), 20, px(m, 20));
  return zx(14, floor, +z.toFixed(2), floor, 20, px(m, 20));

const FONT = { r: ["noto-sans-regular"], m: ["noto-sans-medium"], i: ["noto-sans-italic"] };

const GLYPHS = "glyphs://{fontstack}/{range}";

  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const a = pts[j][i], b = pts[j][i + 1], c = pts[j + 1][i + 1], d = pts[j + 1][i];
    if (rnd() < 0.5) { shard([a, b, c]); shard([a, c, d]); } else { shard([a, b, d]); shard([b, c, d]); }
  }
}

// ---------- B · Mirilla ----------
let bRef = null, bKey = null, bRaf = 0;
const cross = $("#crosshair");
function scheduleB() { if (state.ui === "b" && !bRaf) bRaf = requestAnimationFrame(() => { bRaf = 0; updateB(); }); }
function updateB(force) {
  const c = map.project(map.getCenter());
  cross.style.transform = `translate(${c.x - 28}px, ${c.y - 28}px)`;
  const far = map.getZoom() < 15;
  const ref = far ? null : hitAt(c, 20);
  const key = far ? "far" : refKey(ref) || "none", changed = key !== bKey;
  if (!changed && !force) return;
  bKey = key; bRef = ref;
  setSel(refSel(ref));
  renderPill(far);
  if (changed && sheetOpen()) showSheet(bSheetHTML());
}
function bSheetHTML() {
  return bRef ? sheetHTML(model(bRef, USER))
    : `<div class="sheet__peek empty"><h2>Apunta a una acera</h2><p>Mueve el mapa hasta que la mirilla toque una acera o una zona moto.</p></div>`;
}
function renderPill(far) {
  const pill = $("#pill");
  let tone = "none", main, data;
  if (bRef) {
    const m = model(bRef, USER);
    tone = m.tone; main = m.short;
    data = [m.size, bRef.kind === "ped" ? "" : shortName(m.street)].filter(Boolean).join(" · ") || distText(m.d);
  } else if (far) { main = "Acércate al mapa"; data = "para ver cada acera"; }
  else { main = "Apunta a una acera"; data = "mueve el mapa bajo la mirilla"; }
  pill.innerHTML = `<span class="pill__ic t-${tone}">${tone === "none" ? ICON.aim : toneIcon(tone)}</span>
    <span class="pill__txt"><span class="pill__main">${esc(main)}</span><span class="pill__data">${esc(data)}</span></span>${ICON.chevron}`;
  pill.setAttribute("aria-label", `${main}. ${data}. Ver detalle`);
  pill.dataset.say = `${main}. ${data}.`;
}
$("#pill").onclick = () => {
  if (sheetOpen()) { closeSheet(); return; }
  $("#pill").setAttribute("aria-expanded", "true");
  showSheet(bSheetHTML());
};

// ---------- C · Cerca de ti ----------
let cards = [], active = -1, userMoved = false, settleTimer = 0;
const cardsEl = $("#cards");
function refreshCards() {
  const ctr = centre();
  const bays = DATA.motos.features.map((f, id) => ({ id, d: distToLine(ctr, f.geometry.coordinates) }))
    .filter((x) => x.d <= 300).sort((a, b) => a.d - b.d).slice(0, 4);
  const pieces = [];
  IDX.groups.forEach((g, gi) => { if (g.s <= 1) { const d = distToLine(ctr, g.coords); if (d <= 300) pieces.push({ gi, d }); } });
  pieces.sort((a, b) => a.d - b.d);
  // Bays first: the ordinance prefers them to any sidewalk.
  cards = [
    ...bays.map((b) => ({ key: `b:${b.id}`, ref: { kind: "bay", id: b.id }, ids: [{ source: "motos", id: b.id }], d: b.d })),
    ...pieces.slice(0, 8).map((p) => {
      const g = IDX.groups[p.gi];
      return { key: `g:${p.gi}`, ref: { kind: "piece", id: repOf(g, ctr) }, ids: g.ids.map((id) => ({ source: "aceras", id })), d: p.d, w: g.w };
    }),
  ];
  const nearUser = dist(ctr, USER) < 80;
  $("#near-head").innerHTML = `${nearUser ? "Cerca de ti" : "Cerca del centro del mapa"} <span class="dato">· ${cards.length} ${cards.length === 1 ? "opción" : "opciones"}</span>`;
  cardsEl.innerHTML = cards.length ? cards.map((c, i) => {
    const m = model(c.ref, ctr);
    const meta = c.ref.kind === "bay" ? `${m.size} · ${m.sub.split(" · ")[0].toLowerCase()}` : [c.w != null ? `acera ${fmt(c.w)} m` : "", m.sub.split(" · ").pop()].filter(Boolean).join(" · ");
    return `<li class="card float" data-i="${i}" aria-current="false">
      <button type="button" class="card__main" data-open="${i}" aria-label="${esc(`${m.label}, ${m.street}, a ${distText(c.d)}. Ver detalle`)}">
        <span class="card__row">${tagHTML(m)}<span class="dato">${distText(c.d)}</span></span>
        <span class="card__title">${esc(m.street)}</span>
        <span class="card__meta">${esc(meta)}</span>
      </button>
      <a class="btn-primary" href="${dirURL(m.ll)}" target="_blank" rel="noopener">${ICON.nav}Cómo llegar</a></li>`;
  }).join("") : `<li class="card float empty">Nada para aparcar a menos de 300 m. Mueve el mapa.</li>`;
  cardsEl.scrollLeft = 0; active = -1;
  if (cards.length) activate(0, false); else setSel([]);
  layout(false);
}
function activate(i, fly) {
  if (i === active || !cards[i]) return;
  active = i;
  cardsEl.querySelectorAll(".card").forEach((el, j) => el.setAttribute("aria-current", String(j === i)));
  setSel(cards[i].ids);
  if (sheetOpen()) closeSheet();
  if (fly) map.easeTo({ center: refLL(cards[i].ref), zoom: Math.max(map.getZoom(), 17), duration: dur(600) });
}
function scrollToCard(i) {
  const li = cardsEl.children[i];
  if (li) cardsEl.scrollTo({ left: li.offsetLeft - (cardsEl.clientWidth - li.offsetWidth) / 2, behavior: reduceMotion.matches ? "auto" : "smooth" });
}
cardsEl.addEventListener("scroll", () => {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => {
    const mid = cardsEl.scrollLeft + cardsEl.clientWidth / 2;
    let best = 0, bd = Infinity;
    [...cardsEl.children].forEach((li, i) => { const d = Math.abs(li.offsetLeft + li.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = i; } });
    activate(best, true);
  }, 120);
}, { passive: true });
cardsEl.addEventListener("click", (e) => {
  const b = e.target.closest("[data-open]");
  if (!b) return;
  const i = +b.dataset.open;
  if (i !== active) { scrollToCard(i); activate(i, true); return; }
  showSheet(sheetHTML(model(cards[i].ref, centre())));
});
function tapC(ref) {
  if (!ref) { closeSheetUI(); return; }
  const key = ref.kind === "bay" ? `b:${ref.id}` : ref.kind === "piece" ? `g:${IDX.groupOf[ref.id]}` : "";
  const i = cards.findIndex((c) => c.key === key);
  if (i >= 0) { closeSheet(); scrollToCard(i); activate(i, true); return; }
  setSel(refSel(ref));
  showSheet(sheetHTML(model(ref, centre())));
}

function goBay(id) {
  const ref = { kind: "bay", id };
  if (state.ui === "a") { selectA(ref, Math.max(map.getZoom(), 17.6)); return; }
  if (state.ui === "b") { map.easeTo({ center: refLL(ref), zoom: Math.max(map.getZoom(), 17.4), duration: dur(600) }); return; }
  setSel(refSel(ref)); showSheet(sheetHTML(model(ref, centre())));
  map.easeTo({ center: refLL(ref), zoom: Math.max(map.getZoom(), 17.4), duration: dur(600) });
}

// ---------- switching options and theme ----------
function renderChrome() {
  document.querySelectorAll(".opts button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.ui === state.ui)));
  document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.filter === state.filter)));
  const next = { system: "light", light: "dark", dark: "system" }[state.theme];
  const btn = $("#theme-btn");
  btn.innerHTML = (state.theme === "system" ? ICON.system : state.theme === "light" ? ICON.sun : ICON.moon) + `<span>${THEMES[state.theme]}</span>`;
  btn.setAttribute("aria-label", `Tema: ${THEMES[state.theme]}. Cambiar a ${THEMES[next]}`);
  document.querySelectorAll("[data-for]").forEach((el) => { if (el.id !== "welcome") el.hidden = !el.dataset.for.includes(state.ui); });
  sheet.classList.toggle("snap", state.ui === "b");
  $("#sheet-handle").setAttribute("aria-label", state.ui === "b" ? "Cambiar la altura del detalle" : "Cerrar detalle");
}
function setUI(ui, initial) {
  if (ui === state.ui && map) return;
  state.ui = ui; applyRootAttrs(); save(); renderChrome();
  if (location.hash.slice(1) !== UIS[ui].hash) history.replaceState(null, "", "#" + UIS[ui].hash);
  if (!initial) $("#welcome").hidden = true;
  sheet.dataset.open = "false"; sheetBody.innerHTML = ""; bKey = null;
  if (!map) return;
  setSel([]); clearSearch(); applyVisibility();
  layout(false);
  if (ui === "a") { const r = nearestLegal(centre()); if (r) selectA(r); }
  if (ui === "b") { const r = nearestLegal(centre()); updateB(true); if (r) map.easeTo({ center: refLL(r), zoom: Math.max(map.getZoom(), 17), duration: dur(700) }); }
  if (ui === "c") refreshCards();
}
function applyMapStyle() {
  if (!map) return;
  const layers = buildLayers(resolvedTheme());
  for (const id of map.getLayersOrder()) map.removeLayer(id);
  for (const l of layers) map.addLayer(l);
  for (const s of selIds) map.setFeatureState(s, { sel: true });
}
function themeChanged() { renderChrome(); applyMapStyle(); if (!$("#welcome").hidden) drawTrencadis(); }
darkScheme.addEventListener("change", () => { if (state.theme === "system") themeChanged(); });

function wireUI() {
  document.querySelectorAll(".opts button").forEach((b) => { b.onclick = () => setUI(b.dataset.ui); });
  $("#theme-btn").onclick = () => { state.theme = { system: "light", light: "dark", dark: "system" }[state.theme]; applyRootAttrs(); save(); themeChanged(); };
  document.querySelectorAll(".chip").forEach((c) => { c.onclick = () => { state.filter = c.dataset.filter; renderChrome(); if (map) applyVisibility(); }; });
  $("#locate").onclick = () => {
    if (!map) return;
    toast("La ubicación está desactivada en el prototipo. Te situamos en un punto de ejemplo del Eixample.");
    userMoved = true;
    map.flyTo({ center: USER, zoom: Math.max(map.getZoom(), 17), bearing: DATA.meta.bearing, duration: dur(1200), essential: true });
  };
  $("#enter").onclick = () => { $("#welcome").hidden = true; };
  const q = $("#q");
  q.addEventListener("input", () => { activeIndex = -1; renderResults(); });
  q.addEventListener("focus", renderResults);
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!shown.length) return;
      activeIndex = e.key === "ArrowDown" ? (activeIndex + 1) % shown.length : (activeIndex <= 0 ? shown.length - 1 : activeIndex - 1);
      renderResults(); e.preventDefault();
    } else if (e.key === "Escape") { $("#results").hidden = true; q.setAttribute("aria-expanded", "false"); }
  });
  $("#search").addEventListener("submit", (e) => { e.preventDefault(); const s = shown[Math.max(0, activeIndex)]; if (s && map) goPlace(s); });
  $("#results").addEventListener("pointerdown", (e) => { const li = e.target.closest("li[data-i]"); if (li && map) { e.preventDefault(); goPlace(shown[+li.dataset.i]); } });
  q.addEventListener("blur", () => setTimeout(() => { $("#results").hidden = true; q.setAttribute("aria-expanded", "false"); }, 120));
  $("#q-clear").onclick = () => { clearSearch(); q.focus(); };
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("#welcome").hidden) $("#welcome").hidden = true;
    else if (sheetOpen()) closeSheetUI();
  });
  wide.addEventListener("change", () => { renderChrome(); if (isSnap() && sheetOpen()) setSnap(snap); else layout(false); });
  addEventListener("resize", () => { if (!$("#welcome").hidden) drawTrencadis(); if (isSnap() && sheetOpen()) placeSnap(); });
}

// ---------- start ----------
renderChrome();
wireUI();
if (state.ui === "a") { $("#welcome").hidden = false; requestAnimationFrame(drawTrencadis); }
const bar = $("#progress");
loadData((k) => { bar.firstElementChild.style.width = `${Math.round(k * 100)}%`; bar.setAttribute("aria-valuenow", String(Math.round(k * 100))); }).then((data) => {
  DATA = data;
  IDX = buildIndex(data.aceras);
  // Geolocation is refused in the artifact frame: a fixed example point stands in for the rider.
  USER = data.meta.start;
  PLACES = [
    ...data.meta.calles.map(([name, bbox], i) => ({ kind: "calle", i, name, bbox, key: fold(name) })),
    ...data.calles.features.filter((f) => f.properties.z === 5 || f.properties.z === 6).map((f) => {
      const name = f.properties.z === 6 ? `Metro ${f.properties.t}` : f.properties.t;
      return { kind: f.properties.z === 6 ? "metro" : "lugar", name, ll: f.geometry.coordinates, key: fold(name) };
    }),
  ];
  const lons = data.meta.area.map((p) => p[0]), lats = data.meta.area.map((p) => p[1]);
  const m = 0.004;
  map = new maplibregl.Map({
    container: "map", style: buildStyle(resolvedTheme(), data),
    center: data.meta.start, zoom: wide.matches ? 17.2 : 16.8, bearing: data.meta.bearing,
    minZoom: 14, maxZoom: 19.5, maxBounds: [[Math.min(...lons) - m, Math.min(...lats) - m], [Math.max(...lons) + m, Math.max(...lats) + m]],
    dragRotate: false, pitchWithRotate: false, touchPitch: false, attributionControl: false, renderWorldCopies: false,
    fadeDuration: reduceMotion.matches ? 0 : 200,
  });
  map.touchZoomRotate.disableRotation();
  map.keyboard.disableRotation();
  const me = document.createElement("div"); me.className = "me";
  new maplibregl.Marker({ element: me }).setLngLat(USER).addTo(map);
  map.on("styleimagemissing", (e) => { const img = makeImage(e.id); if (img && !map.hasImage(e.id)) map.addImage(e.id, img.data, img.options); });
  map.on("click", (e) => {
    if (state.ui === "b") { map.easeTo({ center: e.lngLat, duration: dur(450) }); return; }
    const ref = hitAt(e.point, 12);
    if (state.ui === "c") { tapC(ref); return; }
    if (ref) selectA(ref); else { setSel([]); closeSheetUI(); }
  });
  map.on("mousemove", (e) => {
    if (state.ui === "b") return;
    const layers = ["motos-hit", "aceras-hit"].filter((id) => map.getLayer(id) && map.getLayoutProperty(id, "visibility") !== "none");
    map.getCanvas().style.cursor = map.queryRenderedFeatures([[e.point.x - 6, e.point.y - 6], [e.point.x + 6, e.point.y + 6]], { layers }).length ? "pointer" : "";
  });
  map.on("move", scheduleB);
  map.on("resize", () => { if (state.ui === "b") updateB(true); });
  map.on("idle", () => { if (state.ui === "b") updateB(); }); // tiles that arrive late can change what sits under the crosshair
  map.on("movestart", (e) => { if (e.originalEvent) userMoved = true; });
  map.on("moveend", () => {
    if (state.ui === "b") { updateB(); $("#live").textContent = $("#pill").dataset.say || ""; }
    if (state.ui === "c" && userMoved) refreshCards();
    userMoved = false;
  });
  map.once("load", () => {
    $("#loading").hidden = true;
    const ui = state.ui; state.ui = ""; setUI(ui, true);
  });
}).catch((err) => {
  const msg = `<p><strong>No se ha podido cargar el mapa</strong>Falta ${esc(err.message)}. Comprueba la conexión y recarga la página.</p>`;
  $("#loading").innerHTML = msg;
  $("#welcome").hidden = true;
});
})();
</script>
